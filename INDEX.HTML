        }

    // --- منطق الكويز ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    let questions = [];
    let currentIdx = 0;
    let score = 0;

    function startQuiz() {
        questions = JSON.parse(JSON.stringify(database));
        shuffleArray(questions);
        
        questions.forEach(q => {
            const correctTxt = q.o[0]; 
            shuffleArray(q.o);
            q.correctIdx = q.o.indexOf(correctTxt);
        });

        document.getElementById('total-q').innerText = questions.length;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('curr-q').innerText = currentIdx + 1;
        
        let qHTML = q.q.replace(/\(([^)]+)\)/, '<span style="color:#0056b3">($1)</span>');
        qHTML = qHTML.replace(/\[([^\]]+)\]/, '<span class="pronunciation">[$1]</span>');
        
        document.getElementById('question-text').innerHTML = q.icon + " " + qHTML;
        
        const optDiv = document.getElementById('options-container');
        optDiv.innerHTML = '';
        
        q.o.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            optDiv.appendChild(btn);
        });

        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').disabled = true;
    }

    function checkAnswer(idx, btn) {
        const q = questions[currentIdx];
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true);

        if(idx === q.correctIdx) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            btns[q.correctIdx].classList.add('correct');
        }

        document.getElementById('score').innerText = score;
        document.getElementById('exp-text').innerText = "💡 " + q.e;
        
        const memKey = document.getElementById('mem-key');
        if(q.k) {
            memKey.innerText = "🔑 مفتاح الحفظ: " + q.k;
            memKey.style.display = 'block';
        } else {
            memKey.style.display = 'none';
        }
        
        document.getElementById('explanation-box').style.display = 'block';
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = questions.length;
            
            const percentage = (score / questions.length) * 100;
            let msg = "";
            if(percentage >= 90) msg = "أنت أسطورة! جاهز تكون مدير مشروع. 🌟";
            else if(percentage >= 75) msg = "مستوى ممتاز! استمر. 🚀";
            else msg = "تحتاج مراجعة بسيطة، حاول مرة أخرى! 💪";
            document.getElementById('feedback-msg').innerText = msg;
        }
    }
